# Two application instances behind one entry point. A bid accepted on one instance reaches
# sockets held by the other through Postgres LISTEN/NOTIFY.
upstream auction {
    server app-a:8205;
    server app-b:8205;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://auction;
        proxy_http_version 1.1;
        # $http_host keeps the port: the WebSocket origin check compares Origin with Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Sockets idle between bids; the client pings every 20 s, this is the safety margin.
        proxy_read_timeout 120s;
    }
}
