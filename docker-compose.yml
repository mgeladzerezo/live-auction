# Postgres, two application instances and nginx in front of them. Open http://localhost:8205.
x-app: &app
  image: live-auction:local
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-env
    DB_URL: jdbc:postgresql://postgres:5432/auction
    DB_USER: auction
    DB_PASSWORD: auction
    DEMO_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - "5545:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 10

  # app-a builds the image; app-b reuses it (building it twice under one tag collides).
  app-a:
    <<: *app
    build: .
    environment:
      <<: *app-env
      INSTANCE_ID: app-a

  app-b:
    <<: *app
    pull_policy: never
    environment:
      <<: *app-env
      INSTANCE_ID: app-b

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "8205:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
