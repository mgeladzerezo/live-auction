name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test (includes the 200-bidder concurrency proof)
        run: ./mvnw -B verify
      - name: Build the Docker image
        run: docker build -t live-auction:ci .
